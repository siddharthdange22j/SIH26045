version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ip_sakti_sahayak_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://ipsakti_admin:sakti_secure_pass@db:5432/ipsakti_db
    depends_on:
      - db

  db:
    image: pgvector/pgvector:pg16
    container_name: ip_sakti_sahayak_db
    restart: always
    environment:
      POSTGRES_DB: ipsakti_db
      POSTGRES_USER: ipsakti_admin
      POSTGRES_PASSWORD: sakti_secure_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
